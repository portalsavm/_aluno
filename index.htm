 <!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAVM_ALUNO - Sistema de Avaliação Virtual Mazivila</title>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f4f6f9;position:relative}
body::before{content:"";position:fixed;inset:0;background:url('./img_SAVM.png') center no-repeat;background-size:70%;opacity:0.15;pointer-events:none;z-index:0}
header{background:#0a4d68;color:#fff;padding:20px;text-align:center;position:relative;z-index:2}
header h1{margin:0;font-size:24px}
.container{max-width:900px;margin:20px auto;padding:20px;background:rgba(255,255,255,0.95);border-radius:8px;position:relative;z-index:2}
input{width:100%;padding:8px;margin:5px 0;border:1px solid #ccc;border-radius:4px;font-size:16px}
input:focus{outline:none;border:1px solid #0a4d68}
.btn{background:#0a4d68;color:#fff;border:none;padding:10px 18px;border-radius:5px;cursor:pointer;margin:5px;font-weight:bold;font-size:16px}
.btn-green{background:#28a745}.btn-red{background:#dc3545}.btn-whats{background:#25D366}
.hidden{display:none}
#tela-aluno{position:fixed;inset:0;background:rgba(255,255,255,0.95);z-index:9999;overflow:auto;padding:15px}
#contadorSaidas{position:fixed;top:10px;right:10px;background:#dc3545;color:#fff;padding:10px;border-radius:8px;font-weight:bold;z-index:10000}
#cronometro{position:fixed;top:60px;right:10px;background:#0a4d68;color:#fff;padding:10px;border-radius:8px;font-weight:bold;z-index:10000;font-size:16px}
.comprovativo{text-align:center;padding:30px;background:#d4edda;border:3px solid #28a745;border-radius:10px;position:relative;z-index:2}
.nota{font-size:50px;color:#28a745;font-weight:bold;margin:15px 0}
.questao{margin:20px 0;padding-bottom:10px;border-bottom:1px solid #eee;text-align:center;background:rgba(255,255,255,0.9);border-radius:8px;padding:15px}
.escola-cabecalho{text-align:center;padding:10px;background:#0a4d68;color:#fff;margin-bottom:15px;border-radius:5px}
.erro{border:2px solid red!important}
.aviso-vermelho{color:#dc3545;font-size:14px;font-weight:bold;margin-bottom:10px}
label input[type="radio"]{width:auto;margin-right:8px}
.questao-img{max-width:100%;height:auto;margin:10px 0;border:1px solid #ccc;border-radius:4px}
footer{text-align:center;padding:15px;font-size:12px;color:#666;margin-top:20px;position:relative;z-index:2}
.verificando{text-align:center;padding:50px}
.verificando p{font-size:18px;color:#0a4d68;font-weight:bold}
.aviso-seguranca{background:#fff3cd;border:2px solid #ffc107;padding:15px;border-radius:8px;margin-bottom:15px;text-align:center;transition:opacity 0.5s ease}
.codigo-box{text-align:center;background:#e7f3ff;padding:20px;border-radius:8px;border:2px solid #0a4d68;margin-bottom:15px}
</style>
</head>
<body>
<header>
    <h1>Escola Secundária de Mazivila</h1>
  <p> Sistema de Avaliação Virtual Mazivila </p>
</header>

<div class="container" id="menu-inicial">
  <h2>Bem-vindo ao SAVM_ALUNO</h2>
  <div class="menu-inicial">
    <div style="text-align:center">
  <button class="btn btn-blue" onclick="abrir()"> Fazer Prova</button>
</div>
  </div>
</div>

<div id="tela-aluno" class="hidden"></div>

<footer>
  SAVM_ALUNO v3.0 Firebase - © 2026
</footer>
<script>
const jsPDF = window.jspdf.jsPDF;
const API_URL = "https://api.sheetbest.com/sheets/f571368c-451b-40c2-96f7-d8e5d9477510";

// CONFIG FIREBASE DO TEU PROJETO
const firebaseConfig = {
  apiKey: "AIzaSyD20F9TA_VRf6wqCU4GosnsrMwRbTHr6g",
  authDomain: "maziva--links.firebaseapp.com",
  databaseURL: "https://maziva--links-default-rtdb.firebaseio.com",
  projectId: "maziva--links",
  storageBucket: "maziva--links.appspot.com",
  messagingSenderId: "638315261975",
  appId: "1:638315261975:web:500561aad6deb42983f152"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let aluno={}, saidas=3, perguntas=[], respostasAluno=[], config=null, notaFinal=0, codigoGerado="", provaIniciada=false, saidasUsadas=0;
let horaInicio = ""; let horaFim = ""; let provaEnviada = false;
let tempoRestante = 0; let intervaloTimer = null; let pdfBase64 = "";
const NOME_ESCOLA = "Escola Secundária de Mazivila";
const $ = id => document.getElementById(id);

function voltarMenu(){
  $('tela-aluno').classList.add('hidden');
  $('menu-inicial').classList.remove('hidden');
}

function abrir(){
  $('menu-inicial').classList.add('hidden');$('tela-aluno').classList.remove('hidden');
  $('tela-aluno').innerHTML = `
    <button class="btn" onclick="voltarMenu()">← Voltar ao Menu</button>
    <div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div>
    <div class="codigo-box">
      <h3>Digite o Código da Prova</h3>
      <p>Esse código foi enviado pelo professor</p>
    </div>
    <input id="inputCodigo" placeholder="Ex: SAVM-ABC123" style="text-transform:uppercase;font-size:18px;text-align:center">
    <button class="btn btn-green" onclick="buscarProva()">Entrar</button>
  `;
}

function buscarProva(){
  const codigo = $('inputCodigo').value.trim().toUpperCase();
  if(!codigo){alert("Digite o código"); return;}
  
  $('tela-aluno').innerHTML = `<div class="verificando"><p>Buscando prova...</p></div>`;
  
  db.ref('provas/' + codigo).once('value').then((snapshot) => {
    config = snapshot.val();
    if(!config){ 
      alert("Código inválido");
      abrir();
      return; 
    }
    
    saidas=parseInt(config.saidas)||1;saidasUsadas=0;
    let nPerg = config.nPerg || config.perguntas.length;
    let valorPerg = (parseFloat(config.cotacao)/parseInt(nPerg)).toFixed(1);

    let avisoSeg = "";
    if(config.modoSeguranca && config.modoSeguranca.ativar){
      avisoSeg = `<div id="avisoSeguranca" class="aviso-seguranca">
        <h3>AVISO DE SEGURANÇA</h3>
        <p> 1. Não saia desta página durante a avaliação</p><p>2. Não atualize o navegador</p><p>3. Não volte para trás</p>
        <p>Se o fizer, a avaliação será enviada automaticamente.</p>
         <p> 🔒 O aluno não repete pela  segunda vez a mesma avaliação, bloqueia o acesso.</p>
        <button class="btn btn-green" onclick="fecharAvisoEIniciar()">Entendi e Vou Começar</button>
      </div>`;
    }

    $('tela-aluno').innerHTML=`
    ${avisoSeg}
    <div id="telaLogin" class="${config.modoSeguranca.ativar? 'hidden' : ''}">
      ${config.cronometro && config.cronometro.ativar? `<div id="cronometro">Tempo: ${config.cronometro.minutos}:00</div>` : ''}
      <div id="contadorSaidas">Saídas: ${saidas}</div>
      <div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div>
      <h3>AVALIAÇÃO VIRTUAL</h3>
      <div style="background:#e7f3ff;padding:15px;border-radius:8px;margin-bottom:15px;text-align:left">
        <p><b>Tipo:</b> ${config.tipo}</p>
        <p><b>Disciplina:</b> ${config.disciplina}</p>
        <p><b>Classe:</b> ${config.classe}</p>
        <p><b>Data:</b> ${config.data}</p>
        <p><b>Nº de Perguntas:</b> ${nPerg}</p>
        <p><b>Cotação Total:</b> ${config.cotacao} | <b>Valor por pergunta:</b> ${valorPerg}</p>
      </div>
      <label>Nome Completo<input id="n"></label>
      <label>Turma<input id="tu" placeholder="${config.classe}"></label>
      <label>Nº<input id="num" type="number"></label>
      <button class="btn btn-green" onclick="iniciar()">Iniciar Prova</button>
    </div>`;
  }).catch((error) => {
    alert("Erro ao buscar: " + error.message);
    abrir();
  });
}

function mostrarTelaLogin(){$('telaLogin').classList.remove('hidden');}
function fecharAvisoEIniciar(){
  $('avisoSeguranca').style.opacity = "0";
  setTimeout(()=>{$('avisoSeguranca').remove();}, 500);
  mostrarTelaLogin();
}

let listenerSaidaAtivo = false;
function monitorarSaida(){
  if(listenerSaidaAtivo) return;listenerSaidaAtivo = true;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden && provaIniciada && saidas > 0 && config.modoSeguranca.saidas){
      saidasUsadas++;saidas--;
      if($('contadorSaidas'))$('contadorSaidas').innerText=`Saídas: ${saidas}`;
      if(saidas <= 0){finalizar("Limite de saídas atingido");}
    }
  });
  if(config.modoSeguranca && config.modoSeguranca.ativar){
    if(config.modoSeguranca.atualizar){
      window.addEventListener('beforeunload', function(e){
        if(provaIniciada &&!provaEnviada){ finalizar("Prova encerrada por atualização de página"); }
      });
    }
    if(config.modoSeguranca.voltar){
      window.history.pushState(null, null, window.location.href);
      window.addEventListener('popstate', function(){
        if(provaIniciada &&!provaEnviada){
          finalizar("Prova encerrada por voltar/sair");
          window.history.pushState(null, null, window.location.href);
        }
      });
    }
  }
}

function iniciarCronometro(){
  if(!config.cronometro ||!config.cronometro.ativar) return;
  tempoRestante = config.cronometro.minutos * 60;
  intervaloTimer = setInterval(()=>{
    tempoRestante--;
    let min = Math.floor(tempoRestante / 60);
    let seg = tempoRestante % 60;
    if($('cronometro')) $('cronometro').innerText = `Tempo: ${min.toString().padStart(2,'0')}:${seg.toString().padStart(2,'0')}`;
    if(tempoRestante <= 300){
      if($('cronometro')) $('cronometro').style.background = "#dc3545";
    }
    if(tempoRestante <= 0){
      clearInterval(intervaloTimer);
      finalizar("Tempo esgotado");
    }
  }, 1000);
}

const embaralhar = a => {for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function salvarResposta(i,val){respostasAluno[i]=parseInt(val);}

function montar(){
  respostasAluno=[];listenerSaidaAtivo = false;
  let basePerg=[...config.perguntas];
  if(config.nPerg)basePerg=basePerg.slice(0,parseInt(config.nPerg));
  perguntas=[];
  let nPerg = basePerg.length;
  let valorPerg = (parseFloat(config.cotacao)/parseInt(nPerg)).toFixed(1);
  let html=`<div id="contadorSaidas">Saídas: ${saidas}</div>
  ${config.cronometro && config.cronometro.ativar? `<div id="cronometro">Tempo: ${config.cronometro.minutos}:00</div>` : ''}
  <div class="escola-cabecalho"><h2>${NOME_ESCOLA}</h2></div>
  <h3>${config.disciplina} - ${config.tipo}</h3>
  <p style="text-align:center"><b>Aluno:</b> ${aluno.nome} | <b>Turma:</b> ${aluno.turma} | <b>Nº:</b> ${aluno.num}</p>
  <p style="text-align:center;font-size:12px"><b>${nPerg} Perguntas</b> | <b>Cotação:</b> ${config.cotacao} | <b>Cada vale:</b> ${valorPerg}</p><hr>`;
  basePerg.forEach((p,i)=>{
    let ops=p.opcoes.map((o,j)=>({txt:o,idx:j}));
    ops=embaralhar(ops);
    perguntas.push({gab:p.certa});
    html+=`<div class="questao"><p><b>${i+1}.</b> ${p.enun}</p>`;
    if(p.imagem)html+=`<img src="${p.imagem}" class="questao-img">`;
    ops.forEach((o,j)=>html+=`<label style="text-align:left;display:block"><input type="radio" name="q${i}" value="${o.idx}" onchange="salvarResposta(${i},${o.idx})"> ${o.txt}</label>`);
    html+=`</div>`;
  });
  html+=`<button class="btn btn-red" onclick="finalizar('Finalizado pelo aluno')">FINALIZAR PROVA</button>`;
  $('tela-aluno').innerHTML=html;
}

async function iniciar(){
  const nome=$('n').value.trim();
  const turma=$('tu').value.trim();
  const num=$('num').value.trim();
  $('tu').classList.remove('erro');$('num').classList.remove('erro');
  let erro=false;
  if(!nome){alert("Preencha o Nome");return;}
  if(!turma){$('tu').classList.add('erro');erro=true;}
  if(!num){$('num').classList.add('erro');erro=true;}
  if(erro){alert("Preencha Turma e Nº para iniciar");return;}

  aluno={nome,turma,num}; // <-- ESSA LINHA QUE FALTAVA

  const chaveBloqueio = `SAVM-BLOQUEADO-${config.senha}-${num}`;
  if(localStorage.getItem(chaveBloqueio)){
    $('tela-aluno').innerHTML = `<div class="comprovativo" style="background:#f8d7da;border-color:#dc3545"><h2>AVALIAÇÃO JÁ REALIZADA</h2><p>O aluno nº ${num} já realizou esta avaliação.</p></div>`;
    return;
  }
  const agora = new Date();
  horaInicio = agora.toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'});
  $('tela-aluno').innerHTML = `<div class="verificando"><p>Verificando se já fez a prova...</p></div>`;
  try{
    const res = await fetch(API_URL);
    let dados = await res.json();
    let jaFez = dados.find(d => d.Senha === config.senha && d.Numero === num);
    if(jaFez){
      $('tela-aluno').innerHTML = `<div class="comprovativo" style="background:#f8d7da;border-color:#dc3545"><h2>AVALIAÇÃO JÁ REALIZADA</h2><p>O aluno nº ${num} já realizou esta avaliação.</p><p><b>Nota registada: ${jaFez.Nota}</b></p></div>`;
      return;
    }
  }catch(e){ alert("Sem internet. Não foi possível verificar na nuvem."); return; }
  aluno={nome,turma,num};
  provaIniciada=true;
  montar();
  monitorarSaida();
  iniciarCronometro();
}

function calcularDuracao(inicio, fim){
  const [h1,m1] = inicio.split(':').map(Number);
  const [h2,m2] = fim.split(':').map(Number);
  let min = (h2*60 + m2) - (h1*60 + m1);
  if(min < 0) min += 24*60;
  return `${min} min`;
}

function gerarPDF(motivo=""){
  const doc=new jsPDF();
  doc.setFontSize(16);
  doc.text(NOME_ESCOLA,105,20,{align:"center"});
  doc.setFontSize(12);
  doc.text(`COMPROVATIVO DE AVALIAÇÃO`,105,30,{align:"center"});
  doc.setFontSize(10);
  doc.text(`Disciplina: ${config.disciplina}`,15,45);
  doc.text(`Tipo: ${config.tipo}`,15,52);
  doc.text(`Aluno: ${aluno.nome}`,15,59);
  doc.text(`Turma: ${aluno.turma} | Nº: ${aluno.num}`,15,66);
  doc.text(`Data: ${config.data}`,15,73);
  doc.text(`Início: ${horaInicio} | Fim: ${horaFim}`,15,80);
  doc.text(`Duração: ${calcularDuracao(horaInicio, horaFim)}`,15,87);
  doc.setFontSize(14);
  doc.text(`NOTA FINAL: ${notaFinal.toFixed(1)} / ${config.cotacao}`,105,100,{align:"center"});
  doc.setFontSize(8);
  doc.text(`Motivo de encerramento: ${motivo}`,15,110);
  doc.save(`Comprovativo_${aluno.nome}.pdf`);
  pdfBase64 = doc.output('datauristring');
}

async function salvarNaNuvem(motivo){
  const agora = new Date();
  horaFim = agora.toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'});
  const duracao = calcularDuracao(horaInicio, horaFim);
  
  // FORÇAR PEGAR OS DADOS MESMO SE VIEREM VAZIOS
  const dados = {
    "Nº": aluno.num || "",  
    "Nome": aluno.nome || "", 
    "Turma": aluno.turma || "", 
     "Disciplina": config.disciplina || "Sem Disciplina",
    "Classe": config.classe || "",
    "Tipo": config.tipo || "", 
    "Data": config.data || "",
    "Nota": notaFinal.toFixed(1), 
    "Saidas": saidasUsadas, 
    "Observação": motivo,
    "Senha": config.senha || "",
    "Hora Início": horaInicio, 
    "Hora Fim": horaFim, 
    "Duração": duracao
  };

  try{
    await fetch(API_URL, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(dados)});
    const chaveBloqueio = `SAVM-BLOQUEADO-${config.senha}-${aluno.num}`;
    localStorage.setItem(chaveBloqueio, "true");
    console.log("Dados enviados:", dados); // pra debugar
  }catch(e){alert("Erro ao salvar na nuvem: " + e.message);}
}


async function finalizar(motivo){
  if(provaEnviada) return;
  provaEnviada = true;
  clearInterval(intervaloTimer);
  let acertos=0;
  perguntas.forEach((p,i)=>{if(respostasAluno[i]===p.gab)acertos++;});
  let valorPerg = parseFloat(config.cotacao)/perguntas.length;
  notaFinal=acertos*valorPerg;
  await salvarNaNuvem(motivo);
  gerarPDF(motivo);
  $('tela-aluno').innerHTML=`
  <div class="comprovativo">
    <h2>PROVA FINALIZADA</h2>
    <p><b>Aluno:</b> ${aluno.nome}</p>
    <p><b>Disciplina:</b> ${config.disciplina}</p>
    <p><b>Motivo:</b> ${motivo}</p>
    <div class="nota">${notaFinal.toFixed(1)} / ${config.cotacao}</div>
    <p>O comprovativo foi baixado automaticamente.</p>
 
    <button class="btn" onclick="voltarMenu()">Voltar ao Menu</button>
  </div>`;
}
</script>
</body>
</html>
